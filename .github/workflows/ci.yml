# CI workflow — ecosystem §1: single `ci` job named `Test & Build` running `just ci`.
# If CI fails, run `just ci` locally to reproduce.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install openspec (pinned §4)
        run: npm install -g @fission-ai/openspec@0.19.0

      - name: Install ecosystem tools (§4 dogfood matrix, pinned)
        run: cargo install --locked pretender@0.7.0 wai-cli@2026.9.28 dulce-de-leche@0.8.0

      - name: Install bd (beads, pinned §4)
        run: |
          tmp=$(mktemp -d)
          curl -fsSL https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz -o "$tmp/bd.tgz"
          tar -xzf "$tmp/bd.tgz" -C "$tmp" bd
          sudo mv "$tmp/bd" /usr/local/bin/bd

      # DDL-43g: smoke our own live Pages URL — a 404'd book must fail this
      # repo's CI immediately, not wait for the next hub conformance run.
      - name: Smoke live Pages URL
        run: curl -fsS --max-time 10 --retry 2 https://charly-vibes.github.io/funkalization/ >/dev/null
      - name: Run CI pipeline
        run: just ci
