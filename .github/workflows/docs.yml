# Docs workflow — ecosystem §2/§6: mdBook to gh-pages, tag-triggered,
# release page generated from Cargo.toml (never hand-typed versions).

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'theme/**'
      - 'Cargo.toml'
      - 'llms.txt'
      - 'llm.txt'
      - 'justfile'
      - '.github/workflows/docs.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Copy OpenSpec specs into docs source
        # Fleet standardization §2 (DDL-glq): openspec specs must render in
        # the book — same deploy step as ddl's own docs.yml.
        run: |
          mkdir -p docs/src/specs
          for dir in openspec/specs/*/; do
            name=$(basename "$dir")
            cp "$dir/spec.md" "docs/src/specs/$name.md"
          done

      - name: Generate release-status
        # §6: version claims come from Cargo.toml, not hand-typed text.
        # docs/src/release.md is a build artifact — never committed.
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          DATE=$(date +%Y-%m-%d)
          printf '# Release %s\n\n- **Version:** %s (from Cargo.toml)\n- **Build ref:** %s\n- **Generated:** %s\n' \
            "$VERSION" "$VERSION" "${GITHUB_SHA::7}" "$DATE" > docs/src/release.md

      - name: Build docs
        run: mdbook build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
