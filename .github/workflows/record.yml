# Record workflow — capture a scheduled snapshot on main
#
# Runs nightly (and on demand) on main only: observe the wai artifact tree and
# recent commits, rebuild the record, and commit the snapshot deliberately.
# Capture never runs in a pre-commit hook or on a pull request; kaya evaluates
# no thresholds here.
#
# Deliberately NOT triggered on push: a capture derived from push N collides
# with local commits landing while the run executes (the pattern's origin repo
# charly-vibes/kaya saw this live twice on 2026-11-25 during its v0.3.0). The
# nightly snapshot already covers pushed state; dispatch runs the capture
# whenever an immediate one is wanted.
#
# The snapshot push MUST yield to interactive pushes: pull --rebase + retry
# loop below — a bare cron git push forced two rebases in the kaya repo.

name: Record

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    name: Capture record snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install kaya (record compiler, pinned)
        run: cargo install --locked --git https://github.com/charly-vibes/kaya --tag v0.4.1 kaya-vibes

      - name: Configure git
        run: |
          git config user.name "funkalization record"
          git config user.email "record@funkalization.invalid"

      - name: Capture and compile
        run: just record-capture

      - name: Commit the snapshot
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "record is current; nothing to commit"
            exit 0
          fi
          git commit -m "chore(record): capture scheduled snapshot"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            if [ -d .git/rebase-merge ]; then
              echo "snapshot push abandoned: rebase conflict — resolve manually and push" >&2
              exit 1
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "snapshot push failed after 5 attempts" >&2
          exit 1
