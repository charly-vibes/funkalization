# Release workflow — ecosystem §1: tag-triggered 5-target binary matrix with
# canonical naming ({tool}_{VERSION}_{os}_{arch}) and a single checksums.txt,
# plus crates.io publish. Modeled on vampiro's fleet-conformant release.yml.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Install aarch64 cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build x86_64 Linux
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Build aarch64 Linux
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Stage binaries
        run: |
          mkdir -p bins/linux_amd64 bins/linux_arm64
          cp "target/x86_64-unknown-linux-gnu/release/funkalization" "bins/linux_amd64/funkalization"
          cp "target/aarch64-unknown-linux-gnu/release/funkalization" "bins/linux_arm64/funkalization"

      - uses: actions/upload-artifact@v4
        with:
          name: bins-linux
          path: bins/
          retention-days: 1

  build-darwin:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: darwin

      - name: Build x86_64 macOS
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Build aarch64 macOS
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Stage binaries
        run: |
          mkdir -p bins/darwin_amd64 bins/darwin_arm64
          cp "target/x86_64-apple-darwin/release/funkalization" "bins/darwin_amd64/funkalization"
          cp "target/aarch64-apple-darwin/release/funkalization" "bins/darwin_arm64/funkalization"

      - uses: actions/upload-artifact@v4
        with:
          name: bins-darwin
          path: bins/
          retention-days: 1

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Build x86_64 Windows
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p bins/windows_amd64
          cp "target/x86_64-pc-windows-msvc/release/funkalization.exe" "bins/windows_amd64/funkalization.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: bins-windows
          path: bins/
          retention-days: 1

  publish:
    name: Publish to crates.io + GitHub Release
    needs: [build-linux, build-darwin, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - uses: actions/download-artifact@v4
        with:
          pattern: bins-*
          path: bins/
          merge-multiple: true

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Package archives and checksums
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          mkdir -p dist
          # upload-artifact does not preserve file permissions across the
          # artifact roundtrip — restore the exec bit or the archives ship
          # 644 binaries and `curl | tar xz` installs are not runnable (DDL-3av).
          chmod +x -- bins/*/*

          for plat in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            tar -czf "dist/funkalization_${VERSION}_${plat}.tar.gz" \
              -C "bins/${plat}" funkalization
          done

          (cd bins/windows_amd64 && \
           zip "../../dist/funkalization_${VERSION}_windows_amd64.zip" funkalization.exe)

          cd dist && sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE=""
          [[ "${TAG}" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "${TAG}" \
            dist/funkalization_* dist/checksums.txt \
            --generate-notes ${PRERELEASE}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
