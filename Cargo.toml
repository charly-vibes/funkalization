[package]
name = "funkalization"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Visual semantic design workspace — versioned design semantics with evidence tracking and loss-reporting adapters"
license = "Apache-2.0"
repository = "https://github.com/charly-vibes/funkalization"
keywords = ["design", "semantics", "workspace", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
